<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi web con contador</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        img {
            max-width: 300px;
            height: auto;
            margin-bottom: 20px;
        }
        .contador-box {
            font-size: 18px;
            background: #222;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

    <!-- Texto en negrita arriba -->
    <h1>gracias por tu visita picaron</h1>

    <!-- Imagen centrada -->
    <img src="https://upload.wikimedia.org/wikipedia/commons/e/e6/Finger_heart.png" alt="Finger heart">

    <!-- Contador de visitas abajo -->
    <div class="contador-box">
        Visitas: <span id="contador">Cargando...</span>
    </div>

    <script>
        fetch('https://api.countapi.xyz/hit/Kntbr0.github.io/mi-web')
            .then(response => response.json())
            .then(data => {
                document.getElementById('contador').innerText = data.value;
            })
            .catch(error => {
                document.getElementById('contador').innerText = 'No disponible';
            });
    </script>

</body>
</html>
