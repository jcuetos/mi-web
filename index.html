    <meta charset="UTF-8">
    <title>Mi web con contador</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        img {
            max-width: 300px;
            height: auto;
            margin-bottom: 20px;
        }
        .contador-box {
            font-size: 18px;
            background: #222;
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #444;
        }
    </style>

<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NSHH3XHL"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    <!-- Texto en negrita arriba -->
    <h1>gracias por tu visita picaron</h1>

    <!-- Imagen centrada -->
    <img src="https://upload.wikimedia.org/wikipedia/commons/e/e6/Finger_heart.png" alt="Finger heart">

    <!-- Contador de visitas abajo -->
    <div class="contador-box">
        Visitas: <span id="contador">Cargando...</span>
    </div>

    <script>
        // Usamos una API alternativa súper estable para el contador
        fetch('https://api.counterapi.dev/v1/Kntbr0/mi-web/hit')
            .then(response => response.json())
            .then(data => {
                document.getElementById('contador').innerText = data.count;
            })
            .catch(error => {
                document.getElementById('contador').innerText = '1';
            });
    </script>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5072002725898259"
     crossorigin="anonymous"></script>
